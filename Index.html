<style>
:root{
  --row-h:62px;
  --row-gap:2px;
  --sec-h:36px;

  --r-1:6px; --r-2:10px; --r-3:14px; --r-4:20px; --r-5:24px;

  --font-display:'Fraunces','IBM Plex Sans Arabic',serif;
  --font-ui:'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;

  --ease-spring:linear(0,0.006,0.025,0.101,0.539 26.8%,0.721,0.849,0.937,0.991,1.019,1.029,1.028 62.5%,1.014,1.005,1.001,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease:cubic-bezier(0.25,1,0.5,1);
  --d-1:120ms; --d-2:200ms; --d-3:340ms; --d-4:520ms;

  --rail-w:60px;
  --list-w:396px;
}

body{
  --surface-1:color-mix(in oklab, var(--bg), var(--fx) 3.5%);
  --surface-2:color-mix(in oklab, var(--bg), var(--fx) 6.5%);
  --surface-3:color-mix(in oklab, var(--bg), var(--fx) 10%);
  --hairline:color-mix(in oklab, var(--bg), var(--fx) 8%);
  --hairline-strong:color-mix(in oklab, var(--bg), var(--fx) 15%);
  --well:color-mix(in oklab, var(--bg), black var(--well-k));
  --field:color-mix(in oklab, var(--well), var(--fx) 4%);
  --scrollbar-thumb:color-mix(in oklab, var(--text), transparent 88%);
  --specular:inset 0 1px 0 var(--spec-c);
  --shadow-key:0 14px 34px -10px var(--shadow-c);
  --shadow-launcher:0 0 0 1px var(--hairline-strong), var(--shadow-wide), var(--specular);
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}

body[data-theme="aurora"][data-mode="dark"]{
  color-scheme:dark;
  --fx:white; --well-k:28%; --spec-c:rgba(255,255,255,0.06); --shadow-c:rgba(0,0,0,0.7);
  --canvas:oklch(0.1 0.012 293);
  --bg:oklch(0.15 0.013 293);
  --text:oklch(0.955 0.006 293);
  --text-2:oklch(0.76 0.013 293);
  --text-3:oklch(0.55 0.017 293);
  --accent:oklch(0.79 0.085 293);
  --success:oklch(0.78 0.1 158);
  --warn:oklch(0.79 0.09 78);
  --blob-a:oklch(0.5 0.1 293 / 0.3);
  --blob-b:oklch(0.42 0.07 270 / 0.2);
  --ambient-opacity:0.85;
  --noise-op:0.035;
  --shadow-wide:0 44px 100px -24px rgba(0,0,0,0.85);
}

body[data-theme="aurora"][data-mode="light"]{
  color-scheme:light;
  --fx:black; --well-k:3.5%; --spec-c:rgba(255,255,255,0.9); --shadow-c:rgba(50,40,90,0.2);
  --canvas:oklch(0.93 0.01 293);
  --bg:oklch(0.976 0.005 293);
  --text:oklch(0.2 0.02 293);
  --text-2:oklch(0.44 0.02 293);
  --text-3:oklch(0.58 0.016 293);
  --accent:oklch(0.5 0.12 293);
  --success:oklch(0.52 0.12 158);
  --warn:oklch(0.56 0.1 62);
  --blob-a:oklch(0.8 0.08 293 / 0.35);
  --blob-b:oklch(0.86 0.05 270 / 0.3);
  --ambient-opacity:0.6;
  --noise-op:0.02;
  --shadow-wide:0 40px 80px -30px rgba(50,40,90,0.3);
}

body[data-theme="raycast"][data-mode="dark"]{
  color-scheme:dark;
  --fx:white; --well-k:30%; --spec-c:rgba(255,255,255,0.055); --shadow-c:rgba(0,0,0,0.75);
  --canvas:oklch(0.085 0.006 16);
  --bg:oklch(0.13 0.008 16);
  --text:oklch(0.96 0.005 16);
  --text-2:oklch(0.76 0.009 16);
  --text-3:oklch(0.54 0.011 16);
  --accent:oklch(0.75 0.12 15);
  --success:oklch(0.78 0.1 158);
  --warn:oklch(0.79 0.09 78);
  --blob-a:oklch(0.5 0.12 15 / 0.22);
  --blob-b:oklch(0.4 0.06 15 / 0.14);
  --ambient-opacity:0.7;
  --noise-op:0.035;
  --shadow-wide:0 44px 100px -24px rgba(0,0,0,0.9);
}

body[data-theme="raycast"][data-mode="light"]{
  color-scheme:light;
  --fx:black; --well-k:3%; --spec-c:rgba(255,255,255,0.95); --shadow-c:rgba(60,30,35,0.18);
  --canvas:oklch(0.93 0.006 16);
  --bg:oklch(0.985 0.003 16);
  --text:oklch(0.2 0.008 16);
  --text-2:oklch(0.44 0.01 16);
  --text-3:oklch(0.58 0.009 16);
  --accent:oklch(0.56 0.15 17);
  --success:oklch(0.52 0.12 158);
  --warn:oklch(0.56 0.1 62);
  --blob-a:oklch(0.82 0.07 15 / 0.3);
  --blob-b:oklch(0.88 0.04 15 / 0.25);
  --ambient-opacity:0.55;
  --noise-op:0.015;
  --shadow-wide:0 40px 80px -30px rgba(70,30,40,0.28);
}

@supports (corner-shape: squircle){
  .launcher,.row,.pill,.rail-btn,.frame-card,.tile{corner-shape:squircle;}
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}


.icon-svg{display:block;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.icon-svg.filled{fill:currentColor;stroke:none;}

body{
  background-color:var(--canvas);
  font-family:var(--font-ui);
  color:var(--text);
  height:100vh;height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  container-type:inline-size;container-name:launcher;
  transition:background-color var(--d-4) var(--ease);
}
button{font-family:inherit;color:inherit;}

.ambient{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:var(--ambient-opacity);transition:opacity var(--d-4) var(--ease);}
.blob{position:absolute;width:820px;height:820px;border-radius:50%;opacity:0.8;will-change:transform;animation:drift 42s ease-in-out infinite alternate;}
.blob.a{top:calc(-6% - 315px);inset-inline-start:calc(-2% - 315px);background:radial-gradient(closest-side, var(--blob-a) 0%, color-mix(in oklab, var(--blob-a), transparent 60%) 45%, transparent 72%);}
.blob.b{bottom:calc(-6% - 315px);inset-inline-end:calc(-2% - 315px);animation-delay:-19s;background:radial-gradient(closest-side, var(--blob-b) 0%, color-mix(in oklab, var(--blob-b), transparent 60%) 45%, transparent 72%);}
body.tab-hidden .blob,body.blobs-idle .blob,.ambient.busy .blob{animation-play-state:paused;}
@keyframes drift{from{transform:translate3d(0,0,0);}to{transform:translate3d(120px,90px,0);}}

.launcher{
  position:relative;z-index:10;isolation:isolate;
  width:1460px;height:868px;max-width:98vw;max-height:96vh;max-height:96dvh;
  background:var(--bg);
  border-radius:var(--r-5);
  box-shadow:var(--shadow-launcher);
  display:flex;overflow:hidden;
  animation:boot 0.75s var(--ease-out) backwards;
  transition:background var(--d-4) var(--ease),box-shadow var(--d-4) var(--ease);
}
.launcher::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(720px 340px at 16% -10%, color-mix(in oklab, var(--accent), transparent 94%), transparent 72%);
}
.rail,.list-col,.preview{position:relative;z-index:1;}
@keyframes boot{from{transform:scale(0.985) translate3d(0,12px,0);opacity:0;}}

.rail{width:var(--rail-w);flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:18px;border-inline-end:1px solid var(--hairline);z-index:3;}
.rail-cats{display:flex;flex-direction:column;gap:4px;position:relative;}
.rail-utils{display:flex;flex-direction:column;gap:4px;}
.rail-spacer{flex:1;}
.rail-indicator{position:absolute;top:0;left:0;width:38px;height:38px;border-radius:var(--r-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline-strong),var(--specular);z-index:0;transform:translate3d(0,0,0);opacity:0;transition:transform var(--d-3) var(--ease-spring),opacity var(--d-2) var(--ease);will-change:transform;}
.rail-indicator::before{content:'';position:absolute;inset-block:12px;inset-inline-start:-11px;width:2px;border-radius:0 2px 2px 0;background:var(--accent);}

.rail-btn{position:relative;z-index:1;width:38px;height:38px;border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text-3);cursor:pointer;transition:color var(--d-2) var(--ease-out),transform var(--d-1) var(--ease-out);}
.rail-btn:hover{color:var(--text);}
.rail-btn:active{transform:scale(0.94);}
.rail-btn[aria-selected="true"]{color:var(--text);}
.rail-utils .rail-btn[aria-pressed="true"]{color:var(--accent);}
.rail-btn:focus-visible{box-shadow:var(--focus-ring);outline:none;}
.rail-btn .lang-glyph{font-family:var(--font-ar);font-size:12px;font-weight:600;letter-spacing:0.02em;}
.rail-btn::after{content:attr(data-tip);position:absolute;inset-inline-start:calc(100% + 12px);top:50%;transform:translate3d(-4px,-50%,0);padding:5px 10px;border-radius:8px;background:var(--surface-3);box-shadow:0 0 0 1px var(--hairline-strong),var(--shadow-key);color:var(--text);font:500 11.5px var(--font-ar);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 140ms var(--ease),transform 140ms var(--ease-out);z-index:60;}
@media (hover:hover){.rail-btn:hover::after{opacity:1;transform:translate3d(0,-50%,0);transition-delay:300ms;}}

.list-col{width:var(--list-w);flex-shrink:0;display:flex;flex-direction:column;z-index:2;background:var(--bg);border-inline-end:1px solid var(--hairline);}

.brand-row{padding:24px 26px 0;display:flex;align-items:center;gap:10px;}
.brand-row .mark{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:inset 0 0 0 1px var(--hairline-strong);}
.brand-row .name{font-family:var(--font-display);font-size:15px;font-weight:500;letter-spacing:0.02em;color:var(--text-2);font-style:italic;}
.brand-row .rev{margin-inline-start:auto;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.08em;color:var(--text-3);padding:3px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--hairline);}

.search-box{padding:14px 26px 16px;position:relative;display:flex;align-items:center;border-block-end:1px solid var(--hairline);}
.search-box::after{content:'';position:absolute;inset-inline:26px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transition:transform var(--d-4) var(--ease-out);}
.search-box:focus-within::after{transform:scaleX(1);}
.search-box .icon-search{position:absolute;inset-inline-start:26px;color:var(--text-3);transition:color var(--d-2) var(--ease);}
.search-box:focus-within .icon-search{color:var(--accent);}
.search-box.command-mode .icon-search{color:var(--accent);}
#search{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font-ui);font-size:17px;font-weight:400;padding-inline:34px 52px;height:38px;letter-spacing:-0.005em;}
#search::placeholder{color:var(--text-3);font-weight:400;font-size:16px;}
.search-end{position:absolute;inset-inline-end:26px;display:flex;align-items:center;}
.search-end kbd{font-family:var(--font-mono);font-size:10px;color:var(--text-3);padding:3px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface-1);transition:opacity var(--d-1) var(--ease);}
.search-box:focus-within .search-end kbd,.search-box.has-value .search-end kbd{opacity:0;}
.clear-search{position:absolute;inset-inline-end:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer;opacity:0;pointer-events:none;transition:opacity var(--d-2) var(--ease),background var(--d-1) var(--ease),color var(--d-1) var(--ease);border-radius:50%;background:var(--surface-2);}
.clear-search.visible{opacity:1;pointer-events:auto;}
.clear-search:hover{color:var(--text);background:var(--surface-3);}
.clear-search:focus-visible{box-shadow:var(--focus-ring);outline:none;}

.list-header{padding:14px 28px 6px;font-family:var(--font-mono);font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.16em;display:flex;justify-content:space-between;align-items:center;font-weight:500;}
[data-lang="ar"] .list-header{direction:rtl;}
[data-lang="ar"] .list-header span:first-child{font-family:var(--font-ar);letter-spacing:0;text-transform:none;font-size:11px;}
.list-header span:last-child{font-variant-numeric:tabular-nums;}

.scroll-wrap{flex:1;min-height:0;position:relative;}
.scroll-area{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;padding-inline:14px;contain:strict;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--scrollbar-thumb) transparent;}
.scroll-area::-webkit-scrollbar{width:6px;}
.scroll-area::-webkit-scrollbar-track{background:transparent;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:10px;}
.scroll-wrap::after{content:'';position:absolute;inset-inline:0;bottom:0;height:28px;pointer-events:none;z-index:3;background:linear-gradient(transparent,var(--bg));}

.spacer{position:relative;width:100%;}
[data-lang="ar"] .spacer{direction:rtl;}

.sec{position:absolute;top:0;inset-inline:0;height:var(--sec-h);display:flex;align-items:flex-end;gap:10px;padding:0 14px 8px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-3);font-weight:500;}
[data-lang="ar"] .sec{font-family:var(--font-ar);letter-spacing:0;text-transform:none;font-size:11.5px;font-weight:500;}
.sec .cnt{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;font-variant-numeric:tabular-nums;opacity:0.7;}
.sec::after{content:'';flex:1;height:1px;margin-bottom:5px;background:linear-gradient(90deg,var(--hairline),transparent);order:2;}
.sec .cnt{order:3;}
.sec[hidden]{display:none;}
.float-head{position:absolute;z-index:4;pointer-events:none;opacity:0;padding-inline:28px;background:var(--bg);box-shadow:0 1px 0 var(--hairline),0 14px 14px -14px var(--shadow-c);will-change:transform;}
[data-lang="ar"] .float-head{direction:rtl;}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-3);font-family:var(--font-ar);font-size:14px;pointer-events:none;}
.empty[hidden]{display:none;}
.empty svg{opacity:0.3;}

.pill{position:absolute;top:0;inset-inline:0;height:var(--row-h);border-radius:var(--r-3);pointer-events:none;opacity:0;overflow:hidden;
  background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--hairline),var(--specular);
  transform:translate3d(0,0,0);
  transition:transform var(--d-3) var(--ease-spring),opacity var(--d-2) var(--ease);
  will-change:transform;
}
.pill.snap{transition:opacity var(--d-2) var(--ease);}
.pill::before{content:'';position:absolute;top:21px;bottom:21px;inset-inline-start:0;width:2px;border-radius:0 2px 2px 0;background:var(--accent);}
[data-lang="ar"] .pill::before{border-radius:2px 0 0 2px;}

.row{position:absolute;top:0;inset-inline:0;height:var(--row-h);display:flex;align-items:center;gap:14px;padding-inline:14px 12px;border-radius:var(--r-3);cursor:pointer;contain:layout style;transform:translate3d(0,0,0);-webkit-tap-highlight-color:transparent;}
.row[hidden]{display:none;}
.row.enter{animation:rowIn var(--d-3) var(--ease-out) backwards;animation-delay:calc(var(--i,0) * 14ms);}
@keyframes rowIn{from{opacity:0;translate:0 8px;}}

.tile{position:relative;flex:none;width:40px;height:40px;border-radius:var(--r-2);display:grid;place-items:center;color:var(--text-3);
  background:var(--surface-1);
  box-shadow:inset 0 0 0 1px var(--hairline);
}
.tile::before{content:'';position:absolute;inset:0;border-radius:inherit;background:color-mix(in oklab, var(--accent), transparent 86%);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent), transparent 60%);opacity:0;transition:opacity var(--d-2) var(--ease-out);}
.glyph{position:relative;display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:18px;line-height:1;}
.row.active .tile{color:var(--accent);}
.row.active .tile::before{opacity:1;}

.dot{position:absolute;bottom:-3px;inset-inline-end:-3px;width:9px;height:9px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--bg);background:transparent;display:none;}
.dot.ready{display:block;background:var(--success);}
.dot.loading{display:block;background:var(--accent);animation:dotPulse 1s ease-in-out infinite;}
.dot.blocked{display:block;background:var(--warn);}
@keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

.text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.t1{font-family:var(--font-ar);font-size:15.5px;font-weight:500;line-height:1.4;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t2{font-family:var(--font-mono);font-size:10.5px;line-height:1.3;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.01em;}
.t2:empty{display:none;}
[data-lang="ar"] .t1,[data-lang="ar"] .t2{text-align:right;}
[data-lang="en"] .t1,[data-lang="en"] .t2{text-align:left;}
[data-lang="en"] .t1{font-family:var(--font-ui);font-size:15px;}
[data-lang="en"] .t2{font-family:var(--font-ar);font-size:12px;}
.row.active .t1{color:var(--text);}
.row.active .t2{color:var(--text-2);}
mark{background:transparent;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in oklab, var(--accent), transparent 55%);}
.row.is-closed .t1{text-decoration:line-through;text-decoration-thickness:1px;opacity:0.55;}
.row.is-closed .tile{opacity:0.5;}

.tags{display:flex;align-items:center;gap:5px;flex:none;}
.tags:empty{display:none;}
.tag{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.06em;padding:2px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--text-3);background:var(--surface-1);text-transform:uppercase;white-space:nowrap;}
[data-lang="ar"] .tag{font-family:var(--font-ar);letter-spacing:0;text-transform:none;font-size:10.5px;}
.tag.new{color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent), transparent 62%);background:transparent;}
.tag.closed{color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--warn), transparent 66%);background:transparent;}
.tag.var{font-family:var(--font-ar);text-transform:none;letter-spacing:0;color:var(--text-2);max-width:92px;overflow:hidden;text-overflow:ellipsis;}

.pin{opacity:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:transparent;border:none;cursor:pointer;flex:none;transition:opacity var(--d-1) var(--ease);}
@media (hover:hover){.row.active .pin{opacity:0.8;}}
@media (hover:none){.pin{opacity:0.5;}}
.row.pinned .pin{opacity:0.95;color:var(--accent);}
.pin:hover{color:var(--accent);background:var(--surface-2);}
.pin:focus-visible{box-shadow:var(--focus-ring);outline:none;}
.kb{font-family:var(--font-mono);font-size:10px;color:var(--text-3);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:5px;padding:2px 6px;opacity:0;flex:none;font-variant-numeric:tabular-nums;display:none;}
.row.active .kb.on{display:block;opacity:0.85;}
@media (hover:none){.kb{display:none !important;}}

.command .tile{background:transparent;box-shadow:inset 0 0 0 1px var(--hairline-strong);color:var(--text-3);}
.command .tile::before{display:none;}
.command .tile{transition:none;}
.row.command.active .tile{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);transform:none;}
.command .glyph{font-family:var(--font-mono);font-style:normal;font-size:15px;direction:ltr;unicode-bidi:isolate;}
.command .pin,.command .tags{display:none;}

.list-footer{display:flex;align-items:center;gap:14px;font-family:var(--font-ar);font-size:11px;color:var(--text-3);padding:10px 22px;border-top:1px solid var(--hairline);white-space:nowrap;overflow:hidden;flex:none;}
.list-footer .hint{display:inline-flex;align-items:center;gap:6px;}
.list-footer kbd,.help-row kbd{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--text-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline-strong),0 1px 0 var(--hairline-strong);border-radius:5px;padding:2px 5px;}

.preview{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--well);overflow:hidden;transition:background var(--d-4) var(--ease);}

.topbar{min-height:72px;padding:0 24px;border-block-end:1px solid var(--hairline);display:flex;align-items:center;gap:16px;background:var(--well);z-index:20;flex-wrap:wrap;flex:none;transition:background var(--d-4) var(--ease),border-color var(--d-4) var(--ease);}


.app-badge{display:flex;align-items:center;gap:11px;min-width:0;}
.badge-icon{position:relative;width:32px;height:32px;border-radius:var(--r-2);flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:var(--accent);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline-strong);}
.badge-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2);}
.badge-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
.badge-name{font-family:var(--font-ar);font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;line-height:1.35;text-align:left;}
.badge-url{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;direction:ltr;text-align:left;}

.url-box{flex:1;min-width:100px;height:36px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-2);display:flex;align-items:center;padding-inline:12px;gap:8px;position:relative;direction:ltr;}
.url-box svg{color:var(--text-3);flex-shrink:0;}
.url-text{font-family:var(--font-mono);font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.zoom-control{display:flex;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:var(--r-2);padding:2px;gap:2px;}
.zoom-control button{font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--text-3);background:transparent;border:none;border-radius:7px;padding:6px 8px;cursor:pointer;font-variant-numeric:tabular-nums;transition:color var(--d-1) var(--ease-out),background var(--d-1) var(--ease-out);}
.zoom-control button:hover{color:var(--text);}
.zoom-control button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);}
.zoom-control button:focus-visible{box-shadow:var(--focus-ring);outline:none;}

.btn-action{height:36px;padding:0 14px;border-radius:var(--r-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline);border:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background var(--d-1) var(--ease-out),color var(--d-1) var(--ease-out),transform var(--d-1) var(--ease-out),box-shadow var(--d-2) var(--ease-out);font-size:13px;font-weight:500;cursor:pointer;flex-shrink:0;}
.btn-action:hover{background:var(--surface-3);color:var(--text);}
.btn-action:active{transform:scale(0.96);}
.btn-action.primary{background:var(--text);color:var(--bg);box-shadow:none;font-weight:600;}
.btn-action.primary:hover{transform:translateY(-1px);background:var(--text);box-shadow:0 10px 24px -8px var(--shadow-c);}
.btn-action.copied{color:var(--success) !important;}
.btn-action.pinned{color:var(--accent);}
.btn-action:focus-visible{box-shadow:var(--focus-ring);outline:none;}

.vbar{height:46px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;border-block-end:1px solid var(--hairline);}
.vdesc{flex:1;min-width:0;font-family:var(--font-ar);font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vchips{display:flex;align-items:center;gap:4px;padding:3px;border-radius:11px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline);flex:none;}
.vchips:empty{display:none;}
.vchip{position:relative;font-family:var(--font-ar);font-size:12px;font-weight:500;padding:5px 12px;border-radius:8px;border:none;background:transparent;color:var(--text-3);cursor:pointer;white-space:nowrap;transition:color var(--d-1) var(--ease),background var(--d-1) var(--ease);}
.vchip:hover{color:var(--text);}
.vchip[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--hairline-strong),var(--specular);}
.vchip.closed{text-decoration:line-through;text-decoration-thickness:1px;opacity:0.6;}
.vchip:focus-visible{box-shadow:var(--focus-ring);outline:none;}
.vkey{font-family:var(--font-mono);font-size:10px;color:var(--text-3);padding:3px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface-1);flex:none;}
.vkey[hidden]{display:none;}

.frame-wrapper{flex:1;position:relative;overflow:hidden;background:var(--well);padding:16px 18px 18px;}
.frame-card{position:relative;width:100%;height:100%;border-radius:var(--r-3);overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--hairline),var(--shadow-key);}

.loader-overlay,.blocked-overlay{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-1);transition:opacity var(--d-3) var(--ease),visibility var(--d-3) var(--ease);}
.loader-overlay.hidden,.blocked-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.skeleton{position:absolute;inset:0;overflow:hidden;background:var(--surface-2);opacity:0.6;}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--surface-3) 50%,transparent 70%);animation:shimmer 1.6s infinite;}
.loader-overlay.hidden .skeleton::after,.loader-overlay.hidden .pulse-ring::before,body.tab-hidden .skeleton::after,body.tab-hidden .pulse-ring::before{animation:none;}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

.pulse-ring{width:56px;height:56px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:22px;z-index:2;}
.pulse-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:pulseOut 1.5s cubic-bezier(0.2,0.8,0.2,1) infinite;}
.pulse-ring::after{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%;}
@keyframes pulseOut{0%{transform:scale(0.5);opacity:0.85;}100%{transform:scale(1.6);opacity:0;}}

.loader-label{font-family:var(--font-ar);font-size:12px;color:var(--text-2);letter-spacing:0.08em;z-index:2;text-align:center;padding:0 36px;}

.blocked-overlay{gap:4px;}
.blocked-overlay .lock-icon{color:var(--warn);margin-bottom:16px;}
.blocked-overlay p{font-family:var(--font-ar);font-size:13.5px;color:var(--text-2);max-width:300px;text-align:center;line-height:1.7;margin-bottom:18px;}
.blocked-actions{display:flex;gap:10px;}
.blocked-actions button{font-family:var(--font-ar);font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:var(--r-2);border:none;box-shadow:inset 0 0 0 1px var(--hairline-strong);background:var(--surface-3);color:var(--text);cursor:pointer;transition:background var(--d-1) var(--ease-out),transform var(--d-1) var(--ease-out);display:flex;align-items:center;gap:7px;}
.blocked-actions button:hover{background:var(--surface-2);transform:translateY(-1px);}
.blocked-actions button:focus-visible{box-shadow:var(--focus-ring);outline:none;}
.blocked-actions button.primary{background:var(--text);color:var(--bg);box-shadow:none;}

.frame-slot{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transform:translate3d(0,6px,0);transition:opacity var(--d-2) var(--ease),transform var(--d-3) var(--ease-out),visibility 0s linear var(--d-2);pointer-events:none;z-index:5;}
.frame-slot.active{opacity:1;visibility:visible;transform:translate3d(0,0,0);pointer-events:auto;z-index:10;transition:opacity var(--d-2) var(--ease),transform var(--d-3) var(--ease-out),visibility 0s linear 0s;}
.frame-slot iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:#fff;transform-origin:0 0;}

.help-overlay{position:fixed;inset:0;z-index:100;width:100%;height:100%;margin:0;border:none;padding:0;background:transparent;color:inherit;display:none;align-items:center;justify-content:center;max-width:none;max-height:none;}
.help-overlay[open]{display:flex;}
.help-overlay::backdrop{background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.help-card{width:min(640px,92vw);max-height:80vh;overflow-y:auto;background:var(--bg);box-shadow:0 0 0 1px var(--hairline-strong),var(--shadow-wide),var(--specular);border-radius:var(--r-4);padding:24px 26px;animation:boot var(--d-4) var(--ease-out) backwards;}
.help-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-family:var(--font-ar);font-size:15px;font-weight:600;color:var(--text);}
.help-head button{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:none;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;}
.help-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-block-end:1px solid var(--hairline);}
.help-row span{font-family:var(--font-ar);font-size:12.5px;color:var(--text-2);}

@container launcher (max-width:1180px){
  .launcher{flex-direction:column;}
  .rail{flex-direction:row;width:100%;height:52px;padding:0 12px;border-inline-end:none;border-block-end:1px solid var(--hairline);}
  .rail-cats{flex-direction:row;}
  .rail-utils{flex-direction:row;}
  .rail-spacer{display:block;}
  .list-col{width:100%;border-inline-end:none;}
  .rail-btn::after{display:none;}
  .rail{overflow-x:auto;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .rail-cats,.rail-utils{flex:none;}
  .rail-spacer{min-width:8px;}
  .rail-indicator::before{inset:auto 11px -7px 11px;width:auto;height:2px;border-radius:2px 2px 0 0;}
}

@container launcher (max-width:900px){
  .preview{display:none;}
  .list-col{flex:1;min-height:0;}
}

@media (max-width:640px){
  :root{--row-h:68px;}
  .launcher{width:100%;height:100%;border-radius:0;border:none;max-width:none;max-height:none;animation:none;}
  #search{font-size:18px;}
  .list-footer{display:none;}
  .help-grid{grid-template-columns:1fr;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important;}
}

[data-perf="low"] .blob{animation:none;}
[data-perf="low"] body::after,[data-perf="low"] .launcher::before{display:none;}
[data-perf="low"] .row.enter{animation:none;}
[data-perf="low"] .pill{transition-duration:120ms;}

::view-transition-old(root){animation:none;mix-blend-mode:normal;}
::view-transition-new(root){animation:circleReveal var(--d-4) var(--ease-out);mix-blend-mode:normal;}
@keyframes circleReveal{from{clip-path:circle(0% at var(--vt-x,50%) var(--vt-y,50%));}to{clip-path:circle(150% at var(--vt-x,50%) var(--vt-y,50%));}}
</style>

const AR_STRIP = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/;
const AR_FOLD = {'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ى':'ي','ئ':'ي','ء':'','ة':'ه','ؤ':'و'};
const AR_NUM = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};

function fold(input){
  const src = String(input ?? '').normalize('NFKC');
  let text = '';
  const map = [];
  for (let i = 0; i < src.length; i++){
    const c = src[i];
    if (AR_STRIP.test(c)) continue;
    const f = AR_FOLD[c] ?? AR_NUM[c] ?? c.toLowerCase();
    for (const ch of f){ text += ch; map.push(i); }
  }
  return { src, text, map };
}

const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){ return String(s).replace(/[&<>"']/g, c => ESC_MAP[c]); }

function hl(f, range){
  if (!range) return esc(f.src);
  const os = f.map[range[0]] ?? 0;
  const oe = range[1] < f.map.length ? f.map[range[1]] : f.src.length;
  if (oe <= os) return esc(f.src);
  return esc(f.src.slice(0, os)) + '<mark>' + esc(f.src.slice(os, oe)) + '</mark>' + esc(f.src.slice(oe));
}

function subsequence(text, query){
  let ptr = 0, gaps = 0, start = -1, end = -1;
  for (let i = 0; i < query.length; i++){
    const idx = text.indexOf(query[i], ptr);
    if (idx === -1) return null;
    if (start === -1) start = idx;
    gaps += idx - ptr;
    ptr = idx + 1;
    end = idx;
  }
  return { gaps, start, end };
}

function strong(text, q){
  if (!text) return null;
  if (text.startsWith(q)) return { s: 1000, r: [0, q.length] };
  let acc = 0;
  for (const w of text.split(' ')){
    if (w.startsWith(q)) return { s: 800, r: [acc, acc + q.length] };
    acc += w.length + 1;
  }
  const i = text.indexOf(q);
  if (i !== -1) return { s: 600, r: [i, i + q.length] };
  return null;
}

function fuzzy(text, q){
  const sub = subsequence(text, q);
  if (!sub) return null;
  const s = Math.max(0, 400 - 12 * sub.gaps);
  return s > 0 ? { s, r: [sub.start, sub.end + 1] } : null;
}

function matchEntry(e, q){
  const a = strong(e.ar.text, q);
  const n = strong(e.en.text, q);
  if (a || n){
    return { score: Math.max(a ? a.s : 0, n ? n.s : 0), arR: a ? a.r : null, enR: n ? n.r : null, variantId: null };
  }
  for (const al of e.aliases) if (al.includes(q)) return { score: 550, arR: null, enR: null, variantId: null };
  for (const v of e.vars){
    const m = strong(v.ar, q) || strong(v.en, q);
    if (m) return { score: Math.min(m.s, 700) - 20, arR: null, enR: null, variantId: v.id };
    for (const al of v.aliases) if (al.includes(q)) return { score: 540, arR: null, enR: null, variantId: v.id };
  }
  for (const d of e.desc) if (d.includes(q)) return { score: 300, arR: null, enR: null, variantId: null };
  const fa = fuzzy(e.ar.text, q);
  const fe = fuzzy(e.en.text, q);
  if (fa || fe){
    return { score: Math.max(fa ? fa.s : 0, fe ? fe.s : 0), arR: fa ? fa.r : null, enR: fe ? fe.r : null, variantId: null };
  }
  if (e.hosts.includes(q)) return { score: 200, arR: null, enR: null, variantId: null };
  return null;
}

function debounce(fn, delay){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

function buildDataset(json){
  const groups = (json.groups || []).filter(g => g && g.id).map(g => ({ id: g.id, ar: g.ar || g.en || g.id, en: g.en || g.ar || g.id, icon: g.icon }));
  const gids = new Set(groups.map(g => g.id));
  const entries = [];
  const now = Date.now();
  for (const tool of json.tools || []){
    if (!tool || !tool.id) continue;
    const base = tool.variants && tool.variants.length ? tool.variants : [{ id: 'main', url: tool.url }];
    const variants = base.filter(v => v && v.url).map(v => ({
      id: v.id || 'main',
      ar: v.ar || tool.ar || tool.en || '',
      en: v.en || tool.en || tool.ar || '',
      dar: v.dar || tool.dar || '',
      den: v.den || tool.den || '',
      url: v.url,
      closed: !!(v.closed || tool.closed)
    }));
    if (!variants.length) continue;
    let gid = tool.group;
    if (!gids.has(gid)){ gid = '_other'; if (!gids.has(gid)){ groups.push({ id: gid, ar: 'أخرى', en: 'Other', icon: 'grid' }); gids.add(gid); } }
    const hosts = variants.map(v => { try { return new URL(v.url).hostname; } catch (e) { return v.url; } }).join(' ');
    const since = tool.since ? Date.parse(tool.since) : NaN;
    entries.push({
      id: tool.id,
      group: gid,
      icon: tool.icon || ICON_BY_ID[tool.id] || null,
      def: Math.min(Math.max(tool.def | 0, 0), variants.length - 1),
      closed: !!tool.closed,
      isNew: Number.isFinite(since) && now - since < NEW_WINDOW_MS && now >= since,
      ar: fold(tool.ar || tool.en),
      en: fold(tool.en || tool.ar),
      dar: tool.dar || '',
      den: tool.den || '',
      variants,
      aliases: (tool.aliases || []).map(a => fold(a).text),
      desc: [fold(tool.dar).text, fold(tool.den).text].filter(Boolean),
      vars: base.filter(v => v && v.url).map((v, i) => ({
        id: variants[i].id,
        ar: fold(variants[i].ar).text,
        en: fold(variants[i].en).text,
        aliases: (v.aliases || []).map(a => fold(a).text)
      })),
      hosts: fold(hosts).text
    });
  }
  return { groups, entries };
}

function computePlan(){
  const raw = searchEl.value;
  const out = [];
  if (raw.startsWith('>')){
    const q = fold(raw.slice(1).trim()).text;
    for (const c of COMMANDS){
      if (!q || c.fid.includes(q) || c.fa.includes(q) || c.fe.includes(q)) out.push({ k: 'c', key: `c:${c.id}`, cmd: c });
    }
    return { mode: 'command', rows: out };
  }
  const f = fold(raw.trim());
  const q = f.text;
  const inCat = e => state.activeCat === 'all' || e.group === state.activeCat;
  if (q){
    const scored = [];
    for (const e of ENTRIES){
      if (!inCat(e)) continue;
      const m = matchEntry(e, q);
      if (!m) continue;
      let total = m.score + recencyBonus(e.id);
      if (state.pinned.has(e.id)) total += 2000;
      scored.push({ e, m, total });
    }
    scored.sort((a, b) => b.total - a.total || a.e.ar.text.length - b.e.ar.text.length);
    for (const s of scored) out.push({ k: 'a', key: `a:${s.e.id}`, e: s.e, arR: s.m.arR, enR: s.m.enR, hint: s.m.variantId });
    return { mode: 'search', rows: out };
  }
  if (state.activeCat === 'all'){
    const pinned = ENTRIES.filter(e => state.pinned.has(e.id));
    if (pinned.length){
      out.push({ k: 'h', key: 'h:pinned', label: { ar: STR.ar.pinned, en: STR.en.pinned }, count: pinned.length });
      for (const e of pinned) out.push({ k: 'a', key: `a:${e.id}`, e, arR: null, enR: null, hint: null });
    }
    for (const g of GROUPS){
      const list = ENTRIES.filter(e => e.group === g.id && !state.pinned.has(e.id));
      if (!list.length) continue;
      out.push({ k: 'h', key: `h:${g.id}`, label: { ar: g.ar, en: g.en }, count: list.length });
      for (const e of list) out.push({ k: 'a', key: `a:${e.id}`, e, arR: null, enR: null, hint: null });
    }
    return { mode: 'sections', rows: out };
  }
  const list = ENTRIES.filter(inCat);
  list.sort((a, b) => (state.pinned.has(b.id) ? 1 : 0) - (state.pinned.has(a.id) ? 1 : 0));
  for (const e of list) out.push({ k: 'a', key: `a:${e.id}`, e, arR: null, enR: null, hint: null });
  return { mode: 'flat', rows: out };
}

function layout(){
  let y = TOP_PAD;

  for (let i = 0; i < rows.length; i++){
    const r = rows[i];

    r.i = i;
    if (r.k === 'h'){ r.h = SEC_H; headerIdx.push(i); y += SEC_H; }
    else { r.h = ROW_H; r.n = sels.length; sels.push(r); y += ROW_H + ROW_GAP; }
  }
  totalH = y + BOT_PAD;
  spacerEl.style.height = `${totalH}px`;
}

function lowerBound(pos){
  let lo = 0, hi = rows.length - 1, ans = rows.length;
  while (lo <= hi){
    const m = (lo + hi) >> 1;
    if (rows[m].top + rows[m].h > pos){ ans = m; hi = m - 1; } else lo = m + 1;
  }
  return ans;
}
function hitRow(y){
  let lo = 0, hi = rows.length - 1;
  while (lo <= hi){
    const m = (lo + hi) >> 1;
    const r = rows[m];
    if (y < r.top) hi = m - 1;
    else if (y >= r.top + r.h) lo = m + 1;
    else return r;
  }
  return null;
}

const favCache = new Map();

function loadFavicon(url){
  let host;

  const token = ++favToken;
  clearTimeout(loadFavicon.timer);
  const cached = favCache.get(host);
  if (cached === false) return;
  if (cached){ mountFavicon(cached); return; }
  loadFavicon.timer = setTimeout(() => {
    if (token !== favToken) return;
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.onload = () => { favCache.set(host, img); if (token === favToken) mountFavicon(img); };

const pool = new Map();
const MAX_FRAMES = 3;
const FRAME_TIMEOUT_MS = 7000;
const LOADER_DELAY_MS = 140;
const PREVIEW_DELAY_MS = 150;

let previewOn = false;
function previewVisible(){ return previewOn; }

function applyZoom(frame){
  const z = state.zoom;

function createFrame(url){
  const slot = document.createElement('div');
  slot.className = 'frame-slot';
  const frame = document.createElement('iframe');
  frame.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals';
  frame.referrerPolicy = 'no-referrer';
  frame.title = url;

    entry.slot.remove();
    pool.delete(oldest);

const preview = { url: null, timer: 0, loaderTimer: 0 };

function queuePreview(variant){

  const url = variant.url;
  preview.url = url;
  clearTimeout(preview.loaderTimer);
  let entry = pool.get(url);
  if (!entry){
    entry = createFrame(url);
    evictFrames(url);
  } else {
    touchFrame(url);
  }
  if (entry.state === 'ready'){
    revealFrame(url);
  } else if (entry.state === 'blocked'){
    showBlocked(url);
  } else {
    blockedEl.classList.add('hidden');
    for (const e of pool.values()) e.slot.classList.remove('active');

function toggleTheme(originEvent){
  const next = document.body.dataset.theme === 'raycast' ? 'aurora' : 'raycast';
  applyThemeTransition(() => {
    document.body.dataset.theme = next;
    themeToggleBtn.setAttribute('aria-pressed', String(next === 'raycast'));
  }, originEvent);
  savePrefs();
}

function setMode(mode, originEvent){
  applyThemeTransition(() => {
    document.body.dataset.mode = mode;
    modeToggleBtn.setAttribute('aria-pressed', String(mode === 'light'));
    modeToggleBtn.innerHTML = iconSvg(mode === 'light' ? 'sun' : 'moon', 13, 1.7);
  }, originEvent);
  savePrefs();
}

function paintStatic(){
  const lang = state.lang;
  document.documentElement.lang = lang;
  document.body.dataset.lang = lang;
  $('list-title').textContent = t('apps');
  $('btn-launch-label').textContent = t('launch');
  $('blocked-text').textContent = t('blocked');
  $('blocked-open-label').textContent = t('openTab');
  $('blocked-retry-label').textContent = t('retry');
  $('loader-label').textContent = t('connecting');
  $('help-title').textContent = t('help');
  perfToggleBtn.dataset.tip = t('perf');
  soundToggleBtn.dataset.tip = t('sound');
  modeToggleBtn.dataset.tip = t('mode');
  themeToggleBtn.dataset.tip = t('theme');
  langToggleBtn.dataset.tip = t('lang');
  helpToggleBtn.dataset.tip = t('helpTip');
  [perfToggleBtn, soundToggleBtn, modeToggleBtn, themeToggleBtn, langToggleBtn, helpToggleBtn].forEach(b => b.setAttribute('aria-label', b.dataset.tip));
  langToggleBtn.innerHTML = `<span class="lang-glyph">${lang === 'ar' ? 'EN' : 'ع'}</span>`;
  btnPinEl.title = `${t('pin')} (⌥P)`;
  btnCopyEl.title = `${t('copy')} (⌥C)`;
  btnRefreshEl.title = `${t('reload')} (⌥R)`;
  $('list-footer').innerHTML = `<span class="hint"><kbd>↑↓</kbd>${t('navigate')}</span><span class="hint"><kbd>↵</kbd>${t('open')}</span><span class="hint"><kbd>⌥↵</kbd>${t('preview')}</span><span class="hint"><kbd>&gt;</kbd>${t('commands')}</span>`;
  $('help-grid').innerHTML = HELP_ROWS.map(r => `<div class="help-row"><span>${lang === 'ar' ? r[0] : r[1]}</span><kbd>${r[2]}</kbd></div>`).join('');
  const emptyText = emptyEl.querySelector('p');
  if (emptyText) emptyText.textContent = planMode === 'command' ? t('noneCmd') : t('none');
  paintRail();
}

function toggleLang(){
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  paintStatic();
  vchipsKey = '';
  for (const node of live.values()) node._csig = '';
  floatKey = '';
  syncWindow(true);
  updateFloat();
  if (current.entry) paintMeta(current.entry, current.variant);
  savePrefs();
}

function runCommand(cmd){
  SoundEngine.playClick();
  searchEl.value = '';
  onQueryChange(true);
  cmd.run();
  searchEl.focus();
}

function rebuild(opts = {}){
  const plan = computePlan();
  planMode = plan.mode;
  rows = plan.rows;
  layout();
  counterEl.textContent = String(sels.length);
  const none = rows.length === 0;
  if (none){
    emptyEl.innerHTML = `${iconSvg('ghost', 32, 1.4)}<p>${plan.mode === 'command' ? t('noneCmd') : t('none')}</p>`;
  }
  emptyEl.hidden = !none;
  floatKey = '';
  let idx = 0;
  if (opts.keepKey){
    const i = sels.findIndex(r => r.key === opts.keepKey);
    idx = i >= 0 ? i : 0;
  }
  if (opts.stagger) staggerNext = true;
  if (opts.top) scrollToY(0, true);
  for (const [key, node] of live){ node._csig = ''; }
  winA = winB = -1;
  activeKey = null;
  syncWindow(true);
  updateFloat();
  selectIndex(idx, { reveal: !opts.top && !!opts.keepKey, instant: true, force: true, snap: true, sound: false, now: !!opts.now });
}

function onQueryChange(immediate){
  const val = searchEl.value;
  clearSearchEl.classList.toggle('visible', val.length > 0);
  searchBoxEl.classList.toggle('command-mode', val.startsWith('>'));
  searchBoxEl.classList.toggle('has-value', val.length > 0);
  rebuild({ top: true });
}

let filterRaf = 0;
searchEl.addEventListener('input', () => {
  if (filterRaf) cancelAnimationFrame(filterRaf);
  filterRaf = requestAnimationFrame(() => { filterRaf = 0; onQueryChange(); });
});

function selectCategory(id){
  if (state.activeCat === id) return;
  state.activeCat = id;
  paintRail();
  rebuild({ top: true, stagger: true });
}

let pointerRaf = 0, pointerY = 0, lastPX = -1, lastPY = -1;
areaEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  if (Math.abs(e.clientX - lastPX) < 2 && Math.abs(e.clientY - lastPY) < 2) return;
  lastPX = e.clientX; lastPY = e.clientY;
  pointerY = e.clientY;
  if (!pointerRaf) pointerRaf = requestAnimationFrame(processPointer);
}, { passive: true });

function processPointer(){
  pointerRaf = 0;
  if (isScrolling() || glide.raf) return;
  const rect = areaRect;
  const y = pointerY - rect.top + scrollPos;
  const row = hitRow(y);
  if (!row || row.k === 'h') return;
  if (current.row === row) return;
  selectIndex(row.n, { reveal: false, fromPointer: true });
}

spacerEl.addEventListener('click', e => {
  const node = e.target.closest('.row');
  if (!node || !node._row) return;
  const row = node._row;
  if (e.target.closest('.pin')){
    if (row.k === 'a') togglePin(row.e.id);
    return;
  }
  if (current.row !== row) selectIndex(row.n, { reveal: false, now: true });
  openCurrent(false);
});

clearSearchEl.addEventListener('click', () => { searchEl.value = ''; searchEl.focus(); onQueryChange(); });
clearSearchEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); clearSearchEl.click(); } });

soundToggleBtn.addEventListener('click', () => {
  const on = SoundEngine.toggle();
  soundToggleBtn.innerHTML = iconSvg(on ? 'volumeHigh' : 'volumeMute', 13, 1.7);
  soundToggleBtn.setAttribute('aria-pressed', String(on));
  savePrefs();
});
modeToggleBtn.addEventListener('click', e => setMode(document.body.dataset.mode === 'light' ? 'dark' : 'light', e));
themeToggleBtn.addEventListener('click', e => toggleTheme(e));
langToggleBtn.addEventListener('click', () => toggleLang());
perfToggleBtn.addEventListener('click', () => { applyPerf(document.documentElement.dataset.perf !== 'low'); savePrefs(); });
helpToggleBtn.addEventListener('click', () => { helpOverlayEl.showModal(); helpToggleBtn.setAttribute('aria-pressed', 'true'); });
$('help-close').addEventListener('click', () => helpOverlayEl.close());
helpOverlayEl.addEventListener('click', e => { if (e.target === helpOverlayEl) helpOverlayEl.close(); });
helpOverlayEl.addEventListener('close', () => { helpToggleBtn.setAttribute('aria-pressed', 'false'); searchEl.focus(); });

btnPinEl.addEventListener('click', () => { if (current.entry) togglePin(current.entry.id); });
btnCopyEl.addEventListener('click', () => { const u = activeVariantUrl(); if (u) copyText(u, () => flashCopied(btnCopyEl)); });
btnRefreshEl.addEventListener('click', reloadPreview);
btnLaunchEl.addEventListener('click', () => { if (current.entry) recordVisit(current.entry.id); });
$('blocked-open').addEventListener('click', () => { const u = blockedEl.dataset.url; if (u) window.open(u, '_blank', 'noopener'); });
$('blocked-retry').addEventListener('click', reloadPreview);

zoomButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    state.zoom = parseFloat(btn.dataset.zoom);
    zoomButtons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    for (const entry of pool.values()) applyZoom(entry.frame);
    savePrefs();
  });
});

[themeToggleBtn, modeToggleBtn, soundToggleBtn, perfToggleBtn, langToggleBtn, helpToggleBtn, btnLaunchEl, btnRefreshEl, btnCopyEl, btnPinEl].forEach(el => {
  el.addEventListener('mouseenter', () => SoundEngine.playHover());
  el.addEventListener('mousedown', () => SoundEngine.playClick());
});

function navOk(){ return document.activeElement === searchEl || document.activeElement === document.body; }
function pageSize(){ return Math.max(1, Math.floor(viewH / (ROW_H + ROW_GAP)) - 1); }

document.addEventListener('keydown', e => {
  if (helpOverlayEl.open) return;
  if (e.key === '/' && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchEl.focus(); searchEl.select(); return; }

  if (e.altKey && !e.ctrlKey && !e.metaKey){
    const code = e.code;
    if (code === 'KeyP'){ e.preventDefault(); if (current.entry) togglePin(current.entry.id); return; }
    if (code === 'KeyC'){ e.preventDefault(); const u = activeVariantUrl(); if (u) copyText(u, () => flashCopied(btnCopyEl)); return; }
    if (code === 'KeyR'){ e.preventDefault(); reloadPreview(); return; }
    if (code === 'KeyL'){ e.preventDefault(); toggleLang(); return; }
    if (code === 'KeyV'){ e.preventDefault(); cycleVariant(e.shiftKey ? -1 : 1); return; }
    if (/^Digit[0-9]$/.test(code) && e.key !== 'Enter'){
      const n = (Number(code.slice(5)) + 9) % 10;
      const row = sels[n];
      if (row){
        e.preventDefault();
        if (row.k === 'c'){ runCommand(row.cmd); return; }
        SoundEngine.playClick();
        recordVisit(row.e.id);
        window.open(variantFor(row.e, row.hint).url, '_blank', 'noopener');
      }
      return;
    }
  }

  if (e.key === 'Tab' && document.activeElement === searchEl && !e.altKey && !e.metaKey && !e.ctrlKey){
    e.preventDefault();
    const ids = Array.from(rail.keys());
    const i = ids.indexOf(state.activeCat);
    selectCategory(ids[(i + (e.shiftKey ? -1 : 1) + ids.length) % ids.length]);
    return;
  }

  if (e.key === 'Escape'){
    if (document.activeElement === searchEl){
      if (searchEl.value){ searchEl.value = ''; onQueryChange(); }
      else searchEl.blur();
    }
    return;
  }

  if (!navOk() || !sels.length) return;
  const n = sels.length;
  const mv = i => { state.dir = i >= state.sel ? 1 : -1; selectIndex(i, { reveal: true }); };
  switch (e.key){
    case 'ArrowDown': e.preventDefault(); state.dir = 1; selectIndex((state.sel + 1) % n, { reveal: true }); break;
    case 'ArrowUp': e.preventDefault(); state.dir = -1; selectIndex((state.sel - 1 + n) % n, { reveal: true }); break;
    case 'PageDown': e.preventDefault(); mv(Math.min(n - 1, state.sel + pageSize())); break;
    case 'PageUp': e.preventDefault(); mv(Math.max(0, state.sel - pageSize())); break;
    case 'Home': if (!searchEl.value || document.activeElement === document.body){ e.preventDefault(); mv(0); } break;
    case 'End': if (!searchEl.value || document.activeElement === document.body){ e.preventDefault(); mv(n - 1); } break;
    case 'Enter': e.preventDefault(); openCurrent(e.altKey); break;
  }
});

document.addEventListener('visibilitychange', () => { document.body.classList.toggle('tab-hidden', document.hidden); });

let blobIdleTimer = 0, lastBlobActivity = 0;
function markActivity(){
  const now = performance.now();
  if (now - lastBlobActivity < 1000) return;
  lastBlobActivity = now;
  document.body.classList.remove('blobs-idle');
  clearTimeout(blobIdleTimer);
  blobIdleTimer = setTimeout(() => document.body.classList.add('blobs-idle'), 8000);
}
['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, markActivity, { passive: true }));
markActivity();

function measure(){
  const nh = readPx('--row-h', ROW_H);
  const ns = readPx('--sec-h', SEC_H);
  const g = readPx('--row-gap', ROW_GAP);
  viewH = areaEl.clientHeight;
  spacerW = spacerEl.clientWidth;
  previewOn = previewEl.offsetParent !== null;
  scrollPos = areaEl.scrollTop;
  refreshRect();
  const changed = nh !== ROW_H || ns !== SEC_H || g !== ROW_GAP;
  ROW_H = nh; SEC_H = ns; ROW_GAP = g;
  if (changed && rows.length){
    layout();
    winA = winB = -1;
    if (current.row) movePill(current.row, true);
  }
  syncWindow(false);
  updateFloat();
  moveRailIndicator();
  if (current.variant && !preview.url && previewVisible()) showPreview(current.variant);
}
new ResizeObserver(debounce(measure, 60)).observe(areaEl);
window.addEventListener('resize', debounce(measure, 120));

function applyData(json, fromRefresh){
  const keep = current.row ? current.row.key : null;
  setDataset(json);
  buildRail();
  if (fromRefresh){
    rebuild({ keepKey: keep });
  }
}

function readCachedData(){
  const c = readJson(DATA_CACHE_KEY);
  return validData(c) ? c : null;
}

async function refreshData(force){
  try {
    const res = await fetch('fihrist.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const json = await res.json();
    if (!validData(json)) return;
    const same = DATA && json.revision === DATA.revision && json.updated === DATA.updated;
    if (same && !force) return;
    applyData(json, true);
    try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(json)); } catch (e) {}
  } catch (e) {}
}

(function init(){
  const initialTheme = prefs.theme === 'raycast' ? 'raycast' : 'aurora';
  const initialMode = prefs.mode === 'light' ? 'light' : 'dark';
  document.body.dataset.theme = initialTheme;
  document.body.dataset.mode = initialMode;
  themeToggleBtn.setAttribute('aria-pressed', String(initialTheme === 'raycast'));
  modeToggleBtn.setAttribute('aria-pressed', String(initialMode === 'light'));
  modeToggleBtn.innerHTML = iconSvg(initialMode === 'light' ? 'sun' : 'moon', 13, 1.7);
  themeToggleBtn.innerHTML = iconSvg('theme', 13, 1.7);
  helpToggleBtn.innerHTML = iconSvg('helpCircle', 14, 1.7);
  perfToggleBtn.innerHTML = iconSvg('bolt', 13, 1.7);
  soundToggleBtn.innerHTML = iconSvg('volumeMute', 13, 1.7);
  btnPinEl.setAttribute('aria-pressed', 'false');
  applyPerf(typeof prefs.perf === 'string' ? prefs.perf === 'low' : detectLowEnd());
  zoomButtons.forEach(btn => btn.setAttribute('aria-pressed', String(parseFloat(btn.dataset.zoom) === state.zoom)));

  if (prefs.sound){
    SoundEngine.enabled = true;
    soundToggleBtn.innerHTML = iconSvg('volumeHigh', 13, 1.7);
    soundToggleBtn.setAttribute('aria-pressed', 'true');
    const once = () => SoundEngine.init();
    document.addEventListener('pointerdown', once, { once: true });
    document.addEventListener('keydown', once, { once: true });
  }

  let embedded = null;
  try { embedded = JSON.parse($('fihrist-data').textContent); } catch (e) {}
  const cached = readCachedData();
  const start = cached && embedded && (cached.revision ?? 0) > (embedded.revision ?? 0) ? cached : (embedded || cached);
  if (!start) return;
  setDataset(start);
  buildRail();
  paintStatic();
  measure();
  rebuild({ stagger: true, top: true });
  requestAnimationFrame(() => { moveRailIndicator(); updateThemeColorMeta(); });
  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 300));
  idle(() => refreshData(false), { timeout: 1500 });
})();
</script>
