<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>LinkExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg-void:#07060b;
  --surface:rgba(19,17,24,0.72);
  --surface-hover:rgba(255,255,255,0.035);
  --surface-active:rgba(255,255,255,0.07);
  --sidebar-bg:rgba(10,9,14,0.42);
  --topbar-bg:rgba(13,11,17,0.86);
  --border:rgba(255,255,255,0.07);
  --border-light:rgba(255,255,255,0.12);
  --accent:#b199fb;
  --accent-2:#f3b06a;
  --accent-glow:rgba(177,153,251,0.55);
  --text-main:#f6f4fa;
  --text-sec:#a9a3ba;
  --text-mut:#5a5568;
  --pill-shadow:0 10px 28px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.06);
  --pill-indicator-w:3px;
  --pill-indicator-glow:0 0 18px var(--accent-glow);
  --icon-bg:rgba(255,255,255,0.025);
  --icon-bg-active:linear-gradient(140deg,var(--accent),var(--accent-2));
  --icon-color-active:#0c0912;
  --icon-shadow:0 10px 24px rgba(177,153,251,0.28);
  --ambient-opacity:1;
  --blob-a:rgba(120,80,230,0.16);
  --blob-b:rgba(240,150,90,0.08);
  --launcher-shadow:0 0 0 1px rgba(255,255,255,0.045), 0 70px 140px -24px rgba(0,0,0,1), inset 0 1px 2px rgba(255,255,255,0.09);
  --font-display:'Fraunces',serif;
  --font-ui:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --spring:cubic-bezier(0.16,1.15,0.3,1.08);
  --ease:cubic-bezier(0.25,1,0.5,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --noise-op:0.035;
  --scrollbar-thumb:rgba(255,255,255,0.08);
}

[data-mode="light"]{
  --bg-void:#efeae1;
  --surface:rgba(255,253,249,0.82);
  --surface-hover:rgba(20,15,10,0.035);
  --surface-active:rgba(20,15,10,0.055);
  --sidebar-bg:rgba(255,251,245,0.5);
  --topbar-bg:rgba(255,253,249,0.9);
  --border:rgba(30,20,10,0.08);
  --border-light:rgba(30,20,10,0.12);
  --accent:#7c4fe0;
  --accent-2:#d97a3f;
  --accent-glow:rgba(124,79,224,0.28);
  --text-main:#241c30;
  --text-sec:#6d6478;
  --text-mut:#a49cae;
  --pill-shadow:0 10px 26px rgba(120,90,60,0.12), inset 0 1px 1px rgba(255,255,255,0.6);
  --icon-bg:rgba(30,20,10,0.03);
  --icon-color-active:#fffdf9;
  --icon-shadow:0 10px 22px rgba(124,79,224,0.22);
  --blob-a:rgba(124,79,224,0.1);
  --blob-b:rgba(217,122,63,0.09);
  --launcher-shadow:0 0 0 1px rgba(30,20,10,0.06), 0 60px 120px -30px rgba(80,60,30,0.28), inset 0 1px 1px rgba(255,255,255,0.8);
  --noise-op:0.018;
  --scrollbar-thumb:rgba(30,20,10,0.1);
}

[data-theme="raycast"]{
  --bg-void:#000000;
  --surface:rgba(23,23,25,0.97);
  --surface-hover:rgba(255,255,255,0.055);
  --surface-active:rgba(255,255,255,0.09);
  --sidebar-bg:transparent;
  --topbar-bg:rgba(23,23,25,0.98);
  --border:rgba(255,255,255,0.07);
  --border-light:rgba(255,255,255,0.11);
  --accent:#ff6259;
  --accent-2:#ff6259;
  --accent-glow:transparent;
  --text-main:#ffffff;
  --text-sec:#ebebf5;
  --text-mut:#ebebf54d;
  --pill-shadow:inset 0 0 0 1px rgba(255,255,255,0.06), 0 4px 14px rgba(0,0,0,0.25);
  --pill-indicator-w:3px;
  --pill-indicator-glow:none;
  --icon-bg:transparent;
  --icon-bg-active:transparent;
  --icon-color-active:var(--text-main);
  --icon-shadow:none;
  --ambient-opacity:0;
  --launcher-shadow:0 0 0 1px rgba(255,255,255,0.09), 0 40px 90px rgba(0,0,0,0.85);
  --noise-op:0.03;
}

[data-theme="raycast"][data-mode="light"]{
  --bg-void:#ffffff;
  --surface:rgba(255,255,255,0.98);
  --surface-hover:rgba(0,0,0,0.045);
  --surface-active:rgba(0,0,0,0.07);
  --sidebar-bg:transparent;
  --topbar-bg:rgba(250,250,250,0.98);
  --border:rgba(0,0,0,0.08);
  --border-light:rgba(0,0,0,0.12);
  --accent:#e8483f;
  --accent-2:#e8483f;
  --text-main:#111113;
  --text-sec:#4c4c52;
  --text-mut:#a8a8b0;
  --pill-shadow:inset 0 0 0 1px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.06);
  --icon-color-active:var(--text-main);
  --launcher-shadow:0 0 0 1px rgba(0,0,0,0.06), 0 40px 90px rgba(0,0,0,0.14);
  --noise-op:0.012;
  --scrollbar-thumb:rgba(0,0,0,0.1);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

body{
  background-color:var(--bg-void);
  font-family:var(--font-ui);
  color:var(--text-main);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  transition:background-color 0.6s var(--ease);
}

.ambient{
  position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(circle at 50% 0%, var(--blob-a) 0%, transparent 60%);
  opacity:var(--ambient-opacity);
  transition:opacity 0.8s var(--ease),background 0.8s var(--ease);
}

.blob{position:absolute;filter:blur(130px);border-radius:50%;animation:drift 34s infinite alternate cubic-bezier(0.4,0,0.2,1);will-change:transform;opacity:0.65;transition:background 0.8s var(--ease);}
.blob.primary{width:820px;height:820px;background:var(--blob-a);top:-22%;left:-10%;}
.blob.secondary{width:720px;height:720px;background:var(--blob-b);bottom:-22%;right:-10%;animation-delay:-16s;}

@keyframes drift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(130px,95px) scale(1.06);}}

body::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:var(--noise-op);mix-blend-mode:overlay;transition:opacity 0.6s var(--ease);
}

.launcher{
  position:relative;z-index:10;
  width:1460px;height:868px;max-width:98vw;max-height:96vh;
  background:var(--surface);
  backdrop-filter:blur(84px) saturate(180%);
  -webkit-backdrop-filter:blur(84px) saturate(180%);
  border:1px solid var(--border);
  border-radius:26px;
  box-shadow:var(--launcher-shadow);
  display:flex;overflow:hidden;
  transform:scale(0.96) translateY(20px);opacity:0;
  animation:boot 0.65s var(--spring) forwards;
  transition:background 0.5s var(--ease),border-color 0.5s var(--ease),box-shadow 0.5s var(--ease);
}

@keyframes boot{to{transform:scale(1) translateY(0);opacity:1;}}

.sidebar{width:392px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar-bg);position:relative;z-index:2;transition:background 0.5s var(--ease),border-color 0.5s var(--ease);}

.brand-row{padding:28px 32px 4px;display:flex;align-items:center;gap:10px;}
.brand-row .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:11px;color:#0c0912;box-shadow:0 6px 14px var(--accent-glow);}
[data-theme="raycast"] .brand-row .mark{background:var(--accent);color:#fff;box-shadow:none;}
.brand-row span{font-family:var(--font-display);font-size:15px;font-weight:500;letter-spacing:0.01em;color:var(--text-sec);font-style:italic;}

.search-box{padding:18px 32px 22px;position:relative;display:flex;align-items:center;}
.search-box>i.fa-search{position:absolute;left:34px;font-size:19px;color:var(--text-mut);transition:color 0.3s var(--ease),filter 0.3s var(--ease);}
#search{width:100%;background:transparent;border:none;outline:none;color:var(--text-main);font-family:var(--font-display);font-size:29px;font-weight:400;font-style:italic;padding:0 40px 0 44px;height:34px;letter-spacing:-0.01em;}
#search::placeholder{color:var(--text-mut);font-weight:400;font-style:italic;}
.search-box:focus-within>i.fa-search{color:var(--accent);filter:drop-shadow(0 0 10px var(--accent-glow));}

.clear-search{position:absolute;right:32px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text-mut);cursor:pointer;opacity:0;pointer-events:none;transition:all 0.2s var(--ease);border-radius:50%;background:var(--surface-hover);font-size:12px;}
.clear-search.visible{opacity:1;pointer-events:auto;}
.clear-search:hover{color:var(--text-main);background:var(--surface-active);}

.list-header{padding:0 32px 14px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mut);text-transform:uppercase;letter-spacing:0.16em;display:flex;justify-content:space-between;align-items:center;font-weight:500;}

.scroll-area{flex:1;overflow-y:auto;padding:0 20px 20px;position:relative;}
.scroll-area::-webkit-scrollbar{width:6px;}
.scroll-area::-webkit-scrollbar-track{background:transparent;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:10px;}

.app-list{list-style:none;position:relative;display:flex;flex-direction:column;gap:3px;}

.active-pill{position:absolute;left:0;right:0;height:66px;background:var(--surface-active);border:1px solid var(--border-light);border-radius:17px;pointer-events:none;z-index:0;box-shadow:var(--pill-shadow);transition:transform 0.34s var(--ease-out),opacity 0.2s var(--ease),background 0.4s var(--ease),border-color 0.4s var(--ease);opacity:0;transform:translateY(0);will-change:transform,opacity;}
.active-pill::before{content:'';position:absolute;top:16px;bottom:16px;left:-1px;width:var(--pill-indicator-w);background:linear-gradient(var(--accent),var(--accent-2));border-radius:0 4px 4px 0;box-shadow:var(--pill-indicator-glow);transition:background 0.4s var(--ease),width 0.4s var(--ease),box-shadow 0.4s var(--ease);}

.app-item{display:flex;align-items:center;gap:18px;padding:0 20px;height:66px;border-radius:17px;cursor:pointer;position:relative;z-index:1;opacity:0;transform:translateY(6px);animation:itemIn 0.4s var(--ease-out) forwards;}
@keyframes itemIn{to{opacity:1;transform:translateY(0);}}

.app-item .icon-wrapper{width:39px;height:39px;border-radius:12px;background:var(--icon-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-sec);transition:all 0.32s var(--ease-out);will-change:transform;}
.app-item.active .icon-wrapper{background:var(--icon-bg-active);color:var(--icon-color-active);transform:scale(1.12) rotate(-3deg);box-shadow:var(--icon-shadow);border-color:transparent;}

.app-item .name{flex:1;font-family:var(--font-ar);font-size:16.5px;font-weight:400;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.2s var(--ease),font-weight 0.2s var(--ease);letter-spacing:0;}
.app-item.active .name{color:var(--text-main);font-weight:600;}

.app-item .kbd-mini{font-family:var(--font-mono);font-size:10px;color:var(--text-mut);background:var(--surface-hover);border:1px solid var(--border);border-radius:5px;padding:2px 6px;opacity:0;transition:opacity 0.2s var(--ease);}
.app-item.active .kbd-mini{opacity:0.7;}

.empty-state{text-align:center;padding:110px 20px;font-family:var(--font-ui);font-size:14px;color:var(--text-mut);}
.empty-state i{font-size:34px;margin-bottom:18px;opacity:0.25;}

.footer{padding:16px 32px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:13px;background:var(--sidebar-bg);transition:background 0.5s var(--ease),border-color 0.5s var(--ease);}
.footer-row{display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-sec);letter-spacing:0.14em;display:flex;align-items:center;gap:10px;}
.logo i{color:var(--accent);font-size:14px;filter:drop-shadow(0 0 8px var(--accent-glow));transition:color 0.5s var(--ease),filter 0.5s var(--ease);}

.footer-controls{display:flex;align-items:center;gap:8px;}
.hint-row{display:flex;align-items:center;justify-content:center;gap:14px;}
.hint{font-family:var(--font-ui);font-size:11.5px;font-weight:500;color:var(--text-mut);display:flex;align-items:center;gap:6px;}
.hint kbd{font-family:var(--font-ui);font-size:10.5px;font-weight:600;color:var(--text-mut);background:var(--surface-hover);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:2px 6px;text-align:center;display:inline-block;min-width:16px;}

.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-mut);width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s var(--ease-out);font-size:12px;}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-main);transform:scale(1.06);}

.preview{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg-void);overflow:hidden;transition:background 0.5s var(--ease);}

.topbar{height:76px;padding:0 30px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;background:var(--topbar-bg);z-index:20;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);transition:background 0.5s var(--ease),border-color 0.5s var(--ease);}

.dots{display:flex;gap:9px;padding-right:10px;}
.dot{width:12px;height:12px;border-radius:50%;opacity:0.85;transition:opacity 0.2s;}
.dot:hover{opacity:1;}
.dot.r{background:#ff5f57;border:1px solid #e0443e;}
.dot.y{background:#febc2e;border:1px solid #d89f24;}
.dot.g{background:#28c840;border:1px solid #1aab29;}

.app-badge{display:flex;align-items:center;gap:12px;min-width:0;}
.app-badge .badge-icon{width:32px;height:32px;border-radius:10px;background:var(--icon-bg-active);color:var(--icon-color-active);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;box-shadow:var(--icon-shadow);transition:all 0.35s var(--ease-out);}
[data-theme="raycast"] .app-badge .badge-icon{background:var(--surface-active);color:var(--text-main);box-shadow:none;}
.app-badge .badge-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
.app-badge .badge-name{font-family:var(--font-ar);font-size:14.5px;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.app-badge .badge-url{font-family:var(--font-mono);font-size:11px;color:var(--text-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}

.url-box{flex:1;height:38px;background:rgba(0,0,0,0.16);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.25);transition:background 0.5s var(--ease);position:relative;}
[data-mode="light"] .url-box{background:rgba(0,0,0,0.03);box-shadow:inset 0 1px 3px rgba(0,0,0,0.05);}
.url-box i{font-size:11px;color:var(--text-mut);}
.url-text{font-family:var(--font-mono);font-size:12.5px;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.btn-action{height:38px;padding:0 18px;border-radius:10px;background:var(--surface-active);border:1px solid var(--border);color:var(--text-sec);display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;transition:all 0.2s var(--ease-out);font-size:13.5px;font-weight:500;cursor:pointer;flex-shrink:0;}
.btn-action:hover{background:var(--surface-hover);color:var(--text-main);}
.btn-action.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0c0912;border:none;font-weight:600;}
[data-theme="raycast"] .btn-action.primary{background:var(--text-main);color:var(--bg-void);}
.btn-action.primary:hover{transform:scale(1.03);box-shadow:0 10px 26px var(--accent-glow);}
.btn-action.copied{color:#4ade80 !important;}

.frame-wrapper{flex:1;position:relative;overflow:hidden;background:var(--bg-void);}

.loader-overlay{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-void);transition:opacity 0.45s var(--ease),visibility 0.45s var(--ease);}
.loader-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.skeleton{position:absolute;inset:24px;border-radius:16px;overflow:hidden;background:var(--surface-hover);opacity:0.6;}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--surface-active) 50%,transparent 70%);animation:shimmer 1.6s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

.pulse-ring{width:60px;height:60px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:24px;z-index:2;}
.pulse-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:pulseOut 1.5s cubic-bezier(0.2,0.8,0.2,1) infinite;}
.pulse-ring::after{content:'';width:13px;height:13px;background:var(--accent);border-radius:50%;box-shadow:0 0 20px var(--accent);}
@keyframes pulseOut{0%{transform:scale(0.5);opacity:0.85;}100%{transform:scale(1.6);opacity:0;}}

.loader-label{font-family:var(--font-mono);font-size:12px;color:var(--text-sec);letter-spacing:0.16em;z-index:2;}

iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;opacity:0;transform:scale(0.985) translateY(8px);transition:opacity 0.5s var(--ease),transform 0.5s var(--spring);pointer-events:none;z-index:5;will-change:transform,opacity;}
iframe.active{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;z-index:10;}

@media (max-width:950px){
  .launcher{width:100%;height:100%;border-radius:0;border:none;max-width:none;max-height:none;transform:none;animation:none;opacity:1;}
  .preview{display:none;}
  .sidebar{width:100%;border-right:none;background:transparent;}
  #search{font-size:27px;height:36px;}
  .app-item{height:70px;padding:0 22px;}
  .active-pill{height:70px;}
  .app-item .icon-wrapper{width:42px;height:42px;font-size:17px;}
  .app-item .name{font-size:17.5px;}
}
</style>
</head>
<body>
<div class="ambient">
<div class="blob primary"></div>
<div class="blob secondary"></div>
</div>

<div class="launcher">
<div class="sidebar">
  <div class="brand-row"><div class="mark"><i class="fa-solid fa-bolt"></i></div><span>LinkExpress</span></div>
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="search" placeholder="Search apps..." autocomplete="off" spellcheck="false" autofocus>
    <div class="clear-search" id="clear-search"><i class="fas fa-times"></i></div>
  </div>
  <div class="list-header">
    <span>Applications</span>
    <span id="counter">10</span>
  </div>

  <div class="scroll-area">
    <div class="app-list" id="list">
      <div class="active-pill" id="pill"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-row">
      <div class="logo"><i class="fa-solid fa-bolt"></i>LINKEXPRESS</div>
      <div class="footer-controls">
        <button id="sound-toggle" class="icon-btn" title="Toggle Sound"><i class="fas fa-volume-xmark"></i></button>
        <button id="mode-toggle" class="icon-btn" title="Toggle Light/Dark"><i class="fas fa-moon"></i></button>
        <button id="theme-toggle" class="icon-btn" title="Toggle Style"><i class="fas fa-palette"></i></button>
      </div>
    </div>
    <div class="hint-row">
      <div class="hint"><kbd>/</kbd>Search</div>
      <div class="hint"><kbd>↵</kbd>Open</div>
      <div class="hint"><kbd>⌘K</kbd>Focus</div>
    </div>
  </div>
</div>

<div class="preview">
  <div class="topbar">
    <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    <div class="app-badge">
      <div class="badge-icon" id="badge-icon"><i class="fas fa-bolt"></i></div>
      <div class="badge-text">
        <div class="badge-name" id="badge-name" dir="auto">—</div>
        <div class="badge-url" id="badge-url">about:blank</div>
      </div>
    </div>
    <div class="url-box">
      <i class="fas fa-lock"></i>
      <span class="url-text" id="url-display">about:blank</span>
    </div>
    <button class="btn-action" id="btn-copy" title="Copy Link"><i class="fas fa-link"></i></button>
    <button class="btn-action" id="btn-refresh" title="Reload"><i class="fas fa-redo-alt"></i></button>
    <a href="#" target="_blank" class="btn-action primary" id="btn-launch" title="Open Externally">Open <i class="fas fa-arrow-right" style="font-size:11px;"></i></a>
  </div>

  <div class="frame-wrapper" id="frame-wrapper">
    <div class="loader-overlay" id="loader">
      <div class="skeleton"></div>
      <div class="pulse-ring"></div>
      <div class="loader-label" id="loader-label">CONNECTING</div>
    </div>
  </div>
</div>
</div>

<script>
const apps=[
{name:"خارجي 1",url:"https://datakid-github-io.vercel.app/",icon:"fa-briefcase-medical",key:"1"},
{name:"خارجي 3",url:"https://datakid2.vercel.app/",icon:"fa-graduation-cap",key:"2"},
{name:"مجموعات دوائية",url:"https://desktop-ru4x.vercel.app/",icon:"fa-pills",key:"3"},
{name:"لستة الادوية",url:"https://searchbar-five-beta.vercel.app/",icon:"fa-search",key:"4"},
{name:"المنفذ والتحمل",url:"https://newlist2.vercel.app/",icon:"fa-dollar-sign",key:"5"},
{name:"بروتوكولات التأمين",url:"https://protocols-one.vercel.app/",icon:"fa-folder-open",key:"6"},
{name:"بيانات الخارجي",url:"https://simpledashboard21.netlify.app/",icon:"fa-eye",key:"7"},
{name:"فهرس الادوية",url:"https://lx-index.vercel.app/",icon:"fa-book-open",key:"8"},
{name:"حاسبة العائد الاستثماري",url:"https://roi-calculator-eight-omega.vercel.app/",icon:"fa-chart-line",key:"9"},
{name:"الرقم القومي والتاريخ",url:"https://lx-id.vercel.app/",icon:"fa-id-card",key:"0"}
];

const SoundEngine={
  ctx:null,enabled:false,
  init(){if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();}if(this.ctx.state==='suspended'){this.ctx.resume();}},
  toggle(){this.enabled=!this.enabled;if(this.enabled)this.init();return this.enabled;},
  playHover(){
    if(!this.enabled||!this.ctx)return;
    const isRaycast=document.body.getAttribute('data-theme')==='raycast';
    const t=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();
    osc.connect(gain);gain.connect(this.ctx.destination);
    if(isRaycast){osc.type='square';osc.frequency.setValueAtTime(80,t);gain.gain.setValueAtTime(0.015,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.015);osc.start(t);osc.stop(t+0.015);}
    else{osc.type='sine';osc.frequency.setValueAtTime(1200,t);osc.frequency.exponentialRampToValueAtTime(800,t+0.04);gain.gain.setValueAtTime(0.02,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.04);osc.start(t);osc.stop(t+0.04);}
  },
  playClick(){
    if(!this.enabled||!this.ctx)return;
    const isRaycast=document.body.getAttribute('data-theme')==='raycast';
    const t=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();
    osc.connect(gain);gain.connect(this.ctx.destination);
    if(isRaycast){osc.type='triangle';osc.frequency.setValueAtTime(120,t);osc.frequency.exponentialRampToValueAtTime(40,t+0.04);gain.gain.setValueAtTime(0.04,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.04);osc.start(t);osc.stop(t+0.04);}
    else{osc.type='triangle';osc.frequency.setValueAtTime(600,t);osc.frequency.exponentialRampToValueAtTime(300,t+0.08);gain.gain.setValueAtTime(0.04,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      const osc2=this.ctx.createOscillator();osc2.type='sine';osc2.frequency.setValueAtTime(1200,t);osc2.connect(gain);osc2.start(t);osc2.stop(t+0.08);
      osc.start(t);osc.stop(t+0.08);}
  }
};

const listEl=document.getElementById('list');
const searchEl=document.getElementById('search');
const clearSearchEl=document.getElementById('clear-search');
const pillEl=document.getElementById('pill');
const loaderEl=document.getElementById('loader');
const urlDisplayEl=document.getElementById('url-display');
const btnLaunchEl=document.getElementById('btn-launch');
const btnRefreshEl=document.getElementById('btn-refresh');
const btnCopyEl=document.getElementById('btn-copy');
const loaderLabelEl=document.getElementById('loader-label');
const counterEl=document.getElementById('counter');
const frameWrapper=document.getElementById('frame-wrapper');
const themeToggleBtn=document.getElementById('theme-toggle');
const modeToggleBtn=document.getElementById('mode-toggle');
const soundToggleBtn=document.getElementById('sound-toggle');
const badgeIconEl=document.getElementById('badge-icon');
const badgeNameEl=document.getElementById('badge-name');
const badgeUrlEl=document.getElementById('badge-url');

let filteredApps=[...apps];
let selectedIndex=0;
let lastSoundIndex=-1;
let itemNodes=[];
const iframePool={};
let loadTimer=null;
let artificialDelayTimer=null;

document.body.setAttribute('data-theme','aurora');
document.body.setAttribute('data-mode','dark');

const interactiveElements=[themeToggleBtn,modeToggleBtn,soundToggleBtn,btnLaunchEl,btnRefreshEl,btnCopyEl];
interactiveElements.forEach(el=>{el.addEventListener('mouseenter',()=>SoundEngine.playHover());el.addEventListener('mousedown',()=>SoundEngine.playClick());});

clearSearchEl.addEventListener('mouseenter',()=>{if(clearSearchEl.classList.contains('visible'))SoundEngine.playHover();});
clearSearchEl.addEventListener('mousedown',()=>{if(clearSearchEl.classList.contains('visible'))SoundEngine.playClick();});

soundToggleBtn.addEventListener('click',()=>{
  const isEnabled=SoundEngine.toggle();
  const icon=soundToggleBtn.querySelector('i');
  icon.className=isEnabled?'fas fa-volume-high':'fas fa-volume-xmark';
});

modeToggleBtn.addEventListener('click',()=>{
  const isLight=document.body.getAttribute('data-mode')==='light';
  document.body.setAttribute('data-mode',isLight?'dark':'light');
  modeToggleBtn.querySelector('i').className=isLight?'fas fa-moon':'fas fa-sun';
});

themeToggleBtn.addEventListener('click',()=>{
  const isRaycast=document.body.getAttribute('data-theme')==='raycast';
  document.body.setAttribute('data-theme',isRaycast?'aurora':'raycast');
});

clearSearchEl.addEventListener('click',()=>{searchEl.value='';searchEl.focus();searchEl.dispatchEvent(new Event('input'));});

function fuzzySearch(query,items){
  if(!query)return items;
  const lowerQuery=query.toLowerCase();
  return items.map(item=>{
    const nameLower=item.name.toLowerCase();
    const urlLower=item.url.toLowerCase();
    if(nameLower.includes(lowerQuery)||urlLower.includes(lowerQuery))return{item,score:2};
    let qIdx=0;
    for(let char of nameLower){if(char===lowerQuery[qIdx])qIdx++;if(qIdx===lowerQuery.length)return{item,score:1};}
    qIdx=0;
    for(let char of urlLower){if(char===lowerQuery[qIdx])qIdx++;if(qIdx===lowerQuery.length)return{item,score:1};}
    return{item,score:0};
  }).filter(m=>m.score>0).sort((a,b)=>b.score-a.score).map(m=>m.item);
}

function renderList(){
  itemNodes.forEach(node=>node.remove());
  itemNodes=[];
  const empty=listEl.querySelector('.empty-state');
  if(empty)empty.remove();

  if(filteredApps.length===0){
    const div=document.createElement('div');
    div.className='empty-state';
    div.innerHTML='<i class="fas fa-ghost"></i><br>No matches found.';
    listEl.appendChild(div);
    pillEl.style.opacity='0';
    counterEl.textContent='0';
    loaderEl.classList.add('hidden');
    Object.values(iframePool).forEach(iframe=>iframe.classList.remove('active'));
    urlDisplayEl.textContent='';
    badgeNameEl.textContent='—';
    badgeUrlEl.textContent='';
    return;
  }

  counterEl.textContent=filteredApps.length;
  const fragment=document.createDocumentFragment();

  filteredApps.forEach((app,index)=>{
    const li=document.createElement('div');
    li.className=`app-item ${index===selectedIndex?'active':''}`;
    li.style.animationDelay=`${Math.min(index*22,220)}ms`;
    li.innerHTML=`
      <div class="icon-wrapper"><i class="fas ${app.icon}"></i></div>
      <div class="name" dir="auto">${app.name}</div>
      <div class="kbd-mini">⌘${app.key}</div>
    `;
    li.addEventListener('mouseenter',()=>{if(selectedIndex!==index){selectedIndex=index;updateSelection();}});
    li.addEventListener('click',()=>{SoundEngine.playClick();window.open(app.url,'_blank');});
    fragment.appendChild(li);
    itemNodes.push(li);
  });

  listEl.appendChild(fragment);
  updateSelection();
}

function updateSelection(){
  if(filteredApps.length===0)return;
  if(lastSoundIndex!==selectedIndex){SoundEngine.playHover();lastSoundIndex=selectedIndex;}
  itemNodes.forEach((node,idx)=>node.classList.toggle('active',idx===selectedIndex));
  const activeNode=itemNodes[selectedIndex];
  if(activeNode){
    pillEl.style.opacity='1';
    pillEl.style.transform=`translateY(${activeNode.offsetTop}px)`;
    activeNode.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  if(window.innerWidth>950)triggerPreview(filteredApps[selectedIndex]);
}

function revealIframe(url){
  if(urlDisplayEl.getAttribute('data-current')===url){
    loaderEl.classList.add('hidden');
    if(iframePool[url])iframePool[url].classList.add('active');
  }
}

function triggerPreview(app){
  if(!app)return;
  urlDisplayEl.textContent=app.url;
  urlDisplayEl.setAttribute('data-current',app.url);
  btnLaunchEl.href=app.url;
  badgeNameEl.textContent=app.name;
  badgeUrlEl.textContent=app.url.replace(/^https?:\/\//,'');
  badgeIconEl.innerHTML=`<i class="fas ${app.icon}"></i>`;
  loaderLabelEl.textContent='CONNECTING';

  Object.values(iframePool).forEach(iframe=>iframe.classList.remove('active'));
  loaderEl.classList.remove('hidden');

  clearTimeout(loadTimer);clearTimeout(artificialDelayTimer);

  loadTimer=setTimeout(()=>{
    const minLoaderTime=new Promise(resolve=>{artificialDelayTimer=setTimeout(resolve,320);});
    if(!iframePool[app.url]){
      const iframe=document.createElement('iframe');
      iframe.sandbox='allow-scripts allow-same-origin allow-forms';
      iframe.loading='lazy';
      iframe.src=app.url;
      const loadPromise=new Promise(resolve=>{iframe.onload=()=>{iframe.dataset.loaded='true';resolve();};});
      frameWrapper.appendChild(iframe);
      iframePool[app.url]=iframe;
      Promise.all([loadPromise,minLoaderTime]).then(()=>revealIframe(app.url));
    }else if(iframePool[app.url].dataset.loaded==='true'){
      minLoaderTime.then(()=>revealIframe(app.url));
    }
  },70);
}

btnRefreshEl.addEventListener('click',()=>{
  if(filteredApps.length>0&&iframePool[filteredApps[selectedIndex].url]){
    const currentUrl=filteredApps[selectedIndex].url;
    iframePool[currentUrl].classList.remove('active');
    loaderEl.classList.remove('hidden');
    iframePool[currentUrl].src=iframePool[currentUrl].src;
  }
});

btnCopyEl.addEventListener('click',()=>{
  if(filteredApps.length===0)return;
  const url=filteredApps[selectedIndex].url;
  navigator.clipboard.writeText(url).then(()=>{
    const icon=btnCopyEl.querySelector('i');
    btnCopyEl.classList.add('copied');
    icon.className='fas fa-check';
    setTimeout(()=>{btnCopyEl.classList.remove('copied');icon.className='fas fa-link';},1200);
  });
});

searchEl.addEventListener('input',e=>{
  const query=e.target.value;
  clearSearchEl.classList.toggle('visible',query.length>0);
  filteredApps=fuzzySearch(query,apps);
  selectedIndex=0;
  renderList();
});

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus();return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();searchEl.focus();return;}
  if((e.metaKey||e.ctrlKey)&&/^[0-9]$/.test(e.key)){
    const targetApp=apps.find(a=>a.key===e.key);
    if(targetApp){e.preventDefault();SoundEngine.playClick();window.open(targetApp.url,'_blank');}
    return;
  }
  if(filteredApps.length===0)return;
  switch(e.key){
    case'ArrowDown':e.preventDefault();selectedIndex=(selectedIndex+1)%filteredApps.length;updateSelection();break;
    case'ArrowUp':e.preventDefault();selectedIndex=(selectedIndex-1+filteredApps.length)%filteredApps.length;updateSelection();break;
    case'Enter':e.preventDefault();SoundEngine.playClick();window.open(filteredApps[selectedIndex].url,'_blank');break;
    case'Escape':if(document.activeElement===searchEl)searchEl.blur();break;
  }
});

window.addEventListener('resize',()=>{
  if(filteredApps.length>0){
    const activeNode=itemNodes[selectedIndex];
    if(activeNode){
      pillEl.style.transition='none';
      pillEl.style.transform=`translateY(${activeNode.offsetTop}px)`;
      void pillEl.offsetWidth;
      pillEl.style.transition='transform 0.34s var(--ease-out), opacity 0.2s var(--ease), background 0.4s var(--ease), border-color 0.4s var(--ease)';
    }
  }
});

renderList();
</script>

</body>
</html>
